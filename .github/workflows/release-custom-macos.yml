name: Release custom macOS desktop assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version, without the v prefix
        required: true
        type: string
      release_commit:
        description: Exact commit targeted by the release
        required: true
        type: string
      clerk_publishable_key:
        description: Fork's Clerk publishable key
        required: true
        type: string
      clerk_jwt_template:
        description: Fork's Clerk JWT template name
        required: true
        type: string
      clerk_cli_oauth_client_id:
        description: Fork's Clerk CLI OAuth client ID
        required: true
        type: string
      relay_url:
        description: Fork's public Relay HTTPS URL
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  build_bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.release_commit }}
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop --filter=t3
      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ inputs.version }}"
      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop:bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  mac_arm64:
    needs: build_bundle
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.release_commit }}
      release_channel: nightly
      label: macOS arm64
      runner: macos-15-xlarge
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      relay_client_tracing: false
      clerk_publishable_key: ${{ inputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ inputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ inputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ inputs.relay_url }}

  mac_x64:
    needs: build_bundle
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.release_commit }}
      release_channel: nightly
      label: macOS x64
      runner: macos-15
      platform: mac
      target: dmg
      arch: x64
      rust_target: x86_64-apple-darwin
      resource_key: darwin-x64
      relay_client_tracing: false
      clerk_publishable_key: ${{ inputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ inputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ inputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ inputs.relay_url }}

  upload:
    needs: [mac_arm64, mac_x64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.release_commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-mac-*
          path: release-macos
          merge-multiple: true
      - name: Verify draft target and upload DMGs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          [[ "$(git rev-parse HEAD)" == "$RELEASE_COMMIT" ]]
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,targetCommitish > release.json
          jq -e --arg commit "$RELEASE_COMMIT" '.isDraft and .isPrerelease and .targetCommitish == $commit' release.json >/dev/null
          shopt -s nullglob
          files=(release-macos/*.dmg)
          [[ "${#files[@]}" -eq 2 ]]
          gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY"
