name: Sync upstream main

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork main from upstream
        env:
          GH_TOKEN: ${{ github.token }}
          FORK: ${{ github.repository }}
        run: gh api --method POST "repos/${FORK}/merge-upstream" --field branch=main
