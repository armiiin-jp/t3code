name: Release SSH CLI runtimes

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version, without the v prefix
        required: true
        type: string
      release_commit:
        description: Exact commit targeted by the release (defaults to the dispatch ref)
        required: false
        type: string
      clerk_publishable_key:
        description: Fork's Clerk publishable key
        required: true
        type: string
      clerk_jwt_template:
        description: Fork's Clerk JWT template name
        required: true
        type: string
      clerk_cli_oauth_client_id:
        description: Fork's Clerk CLI OAuth client ID
        required: true
        type: string
      relay_url:
        description: Fork's public Relay HTTPS URL
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  build_bundle:
    name: Build shared runtime bundle
    runs-on: ubuntu-24.04
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ inputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ inputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ inputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ inputs.relay_url }}
      T3CODE_TELEMETRY_CHANNEL: dev
      VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.release_commit || github.sha }}
    steps:
      - name: Checkout exact release commit
        shell: bash
        env:
          CHECKOUT_REF: ${{ inputs.release_commit || github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Set up dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Build JS bundle
        run: vp run build:desktop:bundle

      - uses: actions/upload-artifact@v7
        with:
          name: ssh-cli-js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  build_linux_cli:
    name: Build Linux ${{ matrix.arch }} SSH runtime
    needs: build_bundle
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ inputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ inputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ inputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ inputs.relay_url }}
      T3CODE_TELEMETRY_CHANNEL: dev
      VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.release_commit || github.sha }}
    steps:
      - name: Checkout exact release commit
        shell: bash
        env:
          CHECKOUT_REF: ${{ inputs.release_commit || github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Set up dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - uses: actions/download-artifact@v8
        with:
          name: ssh-cli-js-bundle
          path: apps

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"

      - name: Stage resource monitor
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cli-resource-monitor/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor" "$target_dir/t3-resource-monitor"

      - name: Build CLI executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Install patchelf
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }

      - name: Build Linux CLI archive
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-nightly\.[0-9]{8}\.[0-9]+)?$ ]] || { echo "Invalid release version: $VERSION" >&2; exit 1; }
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch "${{ matrix.arch }}" \
            --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: ssh-cli-linux-${{ matrix.arch }}
          path: release-cli/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  upload_release_assets:
    name: Upload SSH runtimes to draft release
    needs: build_linux_cli
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ssh-cli-linux-*
          path: release-cli
          merge-multiple: true

      - name: Create checksums and upload
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.release_commit || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid release commit: $RELEASE_COMMIT" >&2; exit 1; }
          if [[ "$VERSION" == *-nightly.* ]]; then
            tag="v$VERSION"
            expected_prerelease=true
          else
            tag="custom-main-v$VERSION"
            expected_prerelease=false
          fi
          release_json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,targetCommitish)"
          is_draft="$(jq -r .isDraft <<<"$release_json")"
          is_prerelease="$(jq -r .isPrerelease <<<"$release_json")"
          [[ "$is_prerelease" == "$expected_prerelease" ]] || { echo "Release $tag has the wrong Stable/Nightly channel." >&2; exit 1; }
          if [[ "$is_draft" == "true" ]]; then
            target_commitish="$(jq -r .targetCommitish <<<"$release_json")"
            [[ "$target_commitish" == "$RELEASE_COMMIT" || ( "$target_commitish" == "$GITHUB_REF_NAME" && "$GITHUB_SHA" == "$RELEASE_COMMIT" ) ]] || { echo "Draft release $tag does not target $RELEASE_COMMIT." >&2; exit 1; }
          else
            tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
            object_sha="$(jq -r .object.sha <<<"$tag_ref")"
            object_type="$(jq -r .object.type <<<"$tag_ref")"
            while [[ "$object_type" == "tag" ]]; do
              annotated_tag="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_sha="$(jq -r .object.sha <<<"$annotated_tag")"
              object_type="$(jq -r .object.type <<<"$annotated_tag")"
            done
            [[ "$object_type" == "commit" && "$object_sha" == "$RELEASE_COMMIT" ]] || { echo "Published tag $tag does not point to $RELEASE_COMMIT." >&2; exit 1; }
          fi
          cd release-cli
          sha256sum t3-*.tar.gz > SHA256SUMS
          gh release upload "$tag" t3-*.tar.gz SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
